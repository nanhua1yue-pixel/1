# =============================================================
# Server Endpoint Configuration
# Internal admin system: 118.89.58.101:8901
# Public site: feisijia123.cn (HTTPS)
# =============================================================

# --- Internal Admin Server (port 8901, not exposed publicly) ---
server {
    listen 8901;
    server_name 118.89.58.101;

    # 采购首页
    location = / {
        proxy_pass http://127.0.0.1:3000/;
    }

    # CEO驾驶舱
    location /ceo {
        proxy_pass http://127.0.0.1:3000/ceo;
    }

    # Boss驾驶舱
    location /boss {
        proxy_pass http://127.0.0.1:3000/boss;
    }

    # 运营日报
    location /ops {
        proxy_pass http://127.0.0.1:3000/ops;
    }

    # 采购工作台
    location /procurement {
        proxy_pass http://127.0.0.1:3000/procurement;
    }

    # 资金看板
    location /capital {
        proxy_pass http://127.0.0.1:3000/capital;
    }

    # 总览
    location /overview {
        proxy_pass http://127.0.0.1:3000/overview;
    }

    # 运营管理
    location /operations {
        proxy_pass http://127.0.0.1:3000/operations;
    }

    # 商品搜索
    location /search {
        proxy_pass http://127.0.0.1:3000/search;
    }
}

# --- Public Site (feisijia123.cn) ---
# Only /about/ (brand story) and CRMEB mall are accessible.
# All internal admin routes return 404.
server {
    listen 443 ssl;
    server_name feisijia123.cn;

    # Brand story page (public)
    location /about/ {
        proxy_pass http://127.0.0.1:3000/about/;
    }

    # CRMEB mall (default)
    location / {
        proxy_pass http://127.0.0.1:8080/;
    }
}

# --- IP:80 fallback ---
# Block all internal admin routes, only serve public content.
server {
    listen 80;
    server_name 118.89.58.101;

    location / {
        proxy_pass http://127.0.0.1:8080/;
    }

    # Explicitly block internal routes
    location ~ ^/(ceo|boss|ops|procurement|capital|overview|operations|search) {
        return 404;
    }
}
